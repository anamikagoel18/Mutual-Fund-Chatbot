name: Mutual Fund Data Refresh

on:
  schedule:
    - cron: '30 4 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug - Environment & Connectivity
        run: |
          echo "Python Version: $(python3 --version)"
          echo "Connectivity Check:"
          curl -I https://www.indmoney.com/mutual-funds/kotak-large-cap-direct-growth-3941 || echo "Curl failed!"

      - name: Verify Secrets
        run: |
          SECRET_LEN=${#GEMINI_SECRET}
          if [ "$SECRET_LEN" -lt 10 ]; then
            echo "::error::GEMINI_API_KEY is missing or invalid in Secrets (Length: $SECRET_LEN)"
            exit 1
          fi
          echo "✅ Secret is valid ($SECRET_LEN chars)"
        env:
          GEMINI_SECRET: ${{ secrets.GEMINI_API_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install streamlit playwright beautifulsoup4 langchain langchain-community langchain-google-genai chromadb python-dotenv pysqlite3-binary
          python3 -m playwright install chromium
          python3 -m playwright install-deps

      - name: "Phase 1: Scrape Data"
        run: python3 phase1_data_acquisition/scraper.py

      - name: "Phase 2: Transform Data"
        run: python3 phase1_data_acquisition/transform_json.py

      - name: "Phase 3: Ingest Data (Update Vector DB)"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python3 phase2_vector_store/ingest.py

      - name: Commit & Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add phase1_data_acquisition/structured_funds.json structured_funds.json vector_db/ || echo "No changes to add"
          git commit -m "Automated Data Refresh: $(date +'%Y-%m-%d %H:%M')" || echo "Nothing to commit"
          git push

      - name: Final Status Report
        if: always()
        run: |
          echo "=========================================="
          echo "           PIPELINE STATUS REPORT          "
          echo "=========================================="
          echo "Secrets Status: ${{ secrets.GEMINI_API_KEY != '' && 'SET' || 'MISSING' }}"
          echo "Phase 1 (Scraper) Result: $?"
          echo "=========================================="
