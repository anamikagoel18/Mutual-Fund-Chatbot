# Manual Trigger Heartbeat: 2026-03-20 00:10 IST
name: Mutual Fund Data Refresh

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  schedule:
    - cron: '30 4 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug - List Files
        run: ls -R

      - name: Verify Secrets
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "::error::GEMINI_API_KEY is missing in GitHub Secrets! Please add it in Settings > Secrets > Actions."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 langchain langchain-community langchain-google-genai chromadb python-dotenv pysqlite3-binary
          python -m playwright install chromium
          python -m playwright install-deps

      - name: Run Data Refresh Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          echo "--- Phase 1: Scraping ---"
          python phase1_data_acquisition/scraper.py
          echo "--- Phase 2: Transforming ---"
          python phase1_data_acquisition/transform_json.py
          echo "--- Phase 3: Ingesting ---"
          python phase2_vector_store/ingest.py
          echo "--- Pipeline Successfully Completed ---"

      - name: Commit Updated Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add phase1_data_acquisition/structured_funds.json structured_funds.json vector_db/
          git commit -m "Automated Data Refresh: Updated both JSON locations and vector_db" || echo "No changes to commit"
          git push
