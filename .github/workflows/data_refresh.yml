name: Mutual Fund Data Refresh

on:
  schedule:
    # Run at 10:00 AM IST everyday.
    # IST is UTC+5:30, so 10:00 AM IST = 04:30 AM UTC.
    - cron: '30 4 * * *'
  workflow_dispatch: # Allows manual trigger for testing

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 langchain langchain-community langchain-google-genai chromadb python-dotenv
          python -m playwright install chromium
          python -m playwright install-deps

      - name: Run Data Pulse Cycle
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python phase6_scheduler/data_pulse.py

      - name: Commit Updated Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add phase1_data_acquisition/structured_funds.json vector_db/
          git commit -m "Automated Data Refresh: Updated structured_funds.json and vector_db" || echo "No changes to commit"
          git push
