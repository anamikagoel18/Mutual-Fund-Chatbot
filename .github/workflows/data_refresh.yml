name: Mutual Fund Data Refresh

on:
  schedule:
    - cron: '30 4 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug - Environment & Connectivity
        run: |
          echo "Python Version:"
          python3 --version
          echo "Testing Connectivity to INDmoney..."
          curl -I https://www.indmoney.com/mutual-funds/kotak-large-cap-direct-growth-3941 || echo "Curl failed!"
          echo "Disk Space:"
          df -h

      - name: Verify Secrets and Environment
        run: |
          echo "Checking for GEMINI_API_KEY..."
          SECRET_LEN=${#GEMINI_SECRET}
          if [ "$SECRET_LEN" -lt 10 ]; then
            echo "::error::GEMINI_API_KEY is too short or missing! (Length: $SECRET_LEN)"
            echo "Current length: $SECRET_LEN"
            exit 1
          else
            echo "✅ GEMINI_API_KEY found (Length: $SECRET_LEN characters)"
          fi
        env:
          GEMINI_SECRET: ${{ secrets.GEMINI_API_KEY }}

      - name: Final Status Report
        if: always()
        run: |
          echo "=========================================="
          echo "           PIPELINE STATUS REPORT          "
          echo "=========================================="
          echo "Secrets Status: ${{ secrets.GEMINI_API_KEY != '' && 'SET' || 'MISSING' }}"
          echo "Python Version: $(python3 --version)"
          echo "Files in Acquisition Dir: $(ls phase1_data_acquisition/ | xargs)"
          echo "=========================================="

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 langchain langchain-community langchain-google-genai chromadb python-dotenv pysqlite3-binary
          python -m playwright install chromium
          python -m playwright install-deps

      - name: Run Data Refresh Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          echo "--- Phase 1: Scraping ---"
          python3 phase1_data_acquisition/scraper.py
          echo "--- Phase 2: Transforming ---"
          python3 phase1_data_acquisition/transform_json.py
          echo "--- Phase 3: Ingesting ---"
          python3 phase2_vector_store/ingest.py
          echo "--- Pipeline Successfully Completed ---"

      - name: Commit Updated Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add phase1_data_acquisition/structured_funds.json structured_funds.json vector_db/
          git commit -m "Automated Data Refresh: Updated both JSON locations and vector_db" || echo "No changes to commit"
          git push
